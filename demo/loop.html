<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kazu · Loop</title><link rel="stylesheet" href="family.css"><link rel="stylesheet" href="loop.css"></head>
<body><main><!--family-header--><div class="layout"><aside><h2 id="field-title">Your board</h2><form id="setup"><label class="fam-row"><span id="size-label">Size</span><select class="fam-field" id="size"><option value="5">5 × 5</option><option value="7" selected>7 × 7</option><option value="10">10 × 10</option><option value="wide">10 × 6</option><option value="tall">6 × 10</option><option value="custom">Custom</option></select></label><div class="dimensions"><label class="fam-row"><span>Width</span><input class="fam-field" id="width" type="number" min="2" max="10" value="7"></label><label class="fam-row"><span>Height</span><input class="fam-field" id="height" type="number" min="2" max="10" value="7"></label></div><label class="fam-row" data-help-en="Choose how hard the puzzle is. Easy and medium use only plain rules; hard and extra hard ask you to suppose something and see if it breaks." data-help-ja="問題のむずかしさを選びます。やさしい・ふつうは決まった規則だけで解け、むずかしい・とてもむずかしいでは、試して矛盾を確かめる場面があります。"><span id="level-label" data-en="Level" data-ja="むずかしさ">Level</span><select class="fam-field" id="level"><option value="easy" data-en="Easy" data-ja="やさしい">Easy</option><option value="medium" selected data-en="Medium" data-ja="ふつう">Medium</option><option value="hard" data-en="Hard" data-ja="むずかしい">Hard</option><option value="extra-hard" data-en="Extra hard" data-ja="とてもむずかしい">Extra hard</option></select></label><label class="fam-row"><span id="material-label">Board material</span><select class="fam-field" id="material"><option value="ivory">Ivory</option><option value="wood">Wood</option><option value="slate">Slate</option></select></label><label class="fam-row"><span id="seed-label">Seed</span><input class="fam-field" id="seed" type="number" min="1" value="42"></label><button class="fam-button" type="submit" id="new">New puzzle</button></form><button class="text-button" id="share">Share puzzle</button><p id="notice" role="status"></p><p id="unique">Every puzzle is checked for a unique answer.</p></aside><section class="panel fam-felt"><div class="panel-head"><h2>Loop</h2><span id="summary"></span></div><div id="board"></div><p id="clock"></p></section></div><section class="more"><h2 id="rules-title">How to play</h2><p id="rules">Join neighbouring dots to make one loop. Each number tells how many of its four sides belong to the loop. The line cannot branch or cross itself.</p></section><!--family-footer--><!--family-unreviewed--></main><!--family-script--><script type="module" src="loop.js"></script></body></html>
