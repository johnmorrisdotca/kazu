<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kazu · Kakuro</title><link rel="stylesheet" href="family.css"><link rel="stylesheet" href="kakuro.css"></head>
<body><main><!--family-header-->
<div class="layout"><aside><h2 id="field-title">Your board</h2><form id="setup"><label class="fam-row" data-help-en="Choose the size of the grid, counting the row and column of totals. A bigger grid takes longer." data-help-ja="盤の大きさを、合計を書く行と列も数えて選びます。大きいほど時間がかかります。"><span id="size-label" data-en="Size" data-ja="大きさ">Size</span><select class="fam-field" id="size"><option value="6">6 × 6</option><option value="8">8 × 8</option><option value="10" selected>10 × 10</option><option value="12">12 × 12</option></select></label><label class="fam-row" data-help-en="Choose how hard the puzzle is. Easy and medium use only plain rules about which digits can make each total; hard and extra hard ask you to suppose a digit and see if it breaks." data-help-ja="問題のむずかしさを選びます。やさしい・ふつうは合計を作れる数字の組み合わせという規則だけで解け、むずかしい・とてもむずかしいでは、数字を仮に置いて矛盾を確かめる場面があります。"><span id="level-label" data-en="Level" data-ja="むずかしさ">Level</span><select class="fam-field" id="level"><option value="easy" data-en="Easy" data-ja="やさしい">Easy</option><option value="medium" selected data-en="Medium" data-ja="ふつう">Medium</option><option value="hard" data-en="Hard" data-ja="むずかしい">Hard</option><option value="extra-hard" data-en="Extra hard" data-ja="とてもむずかしい">Extra hard</option></select></label><label class="fam-row"><span id="seed-label">Seed</span><input class="fam-field" id="seed" type="number" min="1" max="2147483647" value="42" required></label><label class="fam-row"><span id="material-label">Board material</span><select class="fam-field" id="material"><option value="ivory">Ivory</option><option value="wood">Wood</option><option value="slate">Slate</option></select></label><label class="fam-row"><span id="pieces-label">Digits</span><select class="fam-field" id="pieces"><option value="ink">Ink</option><option value="tiles">Tiles</option></select></label><button class="fam-button" data-primary="true" id="new" type="submit">New puzzle →</button></form><button class="text-button" id="share">Share puzzle</button><p id="notice" role="status"></p><p id="unique">Each generated puzzle has one proved answer. Progress stays on this device.</p></aside>
<section class="panel fam-felt"><div class="panel-head"><h2>Kakuro</h2><span id="summary"></span></div><div id="board"></div></section></div>
<!--family-footer--><!--family-unreviewed--></main><!--family-script--><script type="module" src="kakuro.js"></script></body></html>
