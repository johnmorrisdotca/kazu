<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kazu · Juosan</title><link rel="stylesheet" href="family.css"><link rel="stylesheet" href="juosan.css"></head>
<body><main><!--family-header-->
<p id="intro"></p>
<div class="layout"><aside><h2 id="field-title">Your board</h2><form id="setup">
<label class="fam-row"><span id="size-label">Board</span><select class="fam-field" id="size"><option value="3x2">3 × 2 · Wide</option><option value="2x3">2 × 3 · Tall</option></select></label>
<label class="fam-row"><span id="material-label">Board material</span><select class="fam-field" id="material"><option value="ivory">Ivory</option><option value="wood">Wood</option><option value="slate">Slate</option></select></label>
<label class="fam-row"><span id="pieces-label">Marks</span><select class="fam-field" id="pieces"><option value="ink">Ink</option><option value="tiles">Tiles</option></select></label>
<label class="fam-row"><span id="seed-label">Seed</span><input class="fam-field" id="seed" type="number" min="1" max="2147483647" value="42" required></label>
<button class="fam-button" data-primary="true" id="new" type="submit">New puzzle →</button></form>
<p id="notice" role="status"></p><p id="origin"></p><p id="limits"></p></aside>
<section class="panel fam-felt"><div class="panel-head"><h2>Juosan</h2><span id="summary"></span></div><div id="board"></div></section></div>
<!--family-footer--><!--family-unreviewed--></main><!--family-script--><script type="module" src="juosan.js"></script></body></html>
