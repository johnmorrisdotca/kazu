<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kazu · Shikaku</title><link rel="stylesheet" href="family.css"><link rel="stylesheet" href="shikaku.css"></head>
<body><main><!--family-header-->

<div class="layout"><aside><h2 id="field-title">Your board</h2><form id="setup"><label class="fam-row" data-help-en="Choose a named, proved-unique Shikaku challenge route." data-help-ja="名前付きの、答えが一つの四角に切れチャレンジを選びます。"><span id="pack-label">Challenge pack</span><select class="fam-field" id="pack"><option value="">Free play</option><option value="square">The Courtyard · Square</option><option value="wide">The Long Table · Wide</option><option value="tall">The Narrow Garden · Tall</option></select></label><label class="fam-row" data-help-en="Choose one of three challenges in this pack." data-help-ja="このパックの三つのチャレンジから選びます。"><span id="challenge-label">Challenge</span><select class="fam-field" id="challenge" disabled></select></label><button class="fam-button" id="play-challenge" type="button" disabled>Play challenge</button><label class="fam-row" data-help-en="Choose the setting for this board." data-help-ja="この盤の設定を選びます。"><span id="size-label">Size</span><select class="fam-field" id="size"><option value="5">5 × 5</option><option value="7" selected>7 × 7</option><option value="10">10 × 10</option><option value="14">14 × 14</option><option value="wide">10 × 6</option><option value="tall">6 × 10</option><option value="custom">Custom / 自分で選ぶ</option></select></label><div class="shikaku-dimensions"><label class="fam-row" data-help-en="Choose any width from 2 to 16 cells." data-help-ja="幅を2～16マスから選びます。"><span id="width-label">Width</span><input class="fam-field" id="width" type="number" min="2" max="16" value="7" required></label><label class="fam-row" data-help-en="Choose any height from 2 to 16 cells." data-help-ja="高さを2～16マスから選びます。"><span id="height-label">Height</span><input class="fam-field" id="height" type="number" min="2" max="16" value="7" required></label></div><label class="fam-row" data-help-en="Choose how hard the puzzle is. Easy and medium can be solved with plain rules about which rectangles fit; hard and extra hard ask you to suppose a rectangle and see if it breaks." data-help-ja="問題のむずかしさを選びます。やさしい・ふつうはどの長方形が入るかという規則だけで解け、むずかしい・とてもむずかしいでは、長方形を仮に置いて矛盾を確かめる場面があります。"><span id="level-label">Level</span><select class="fam-field" id="level"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option><option value="extra-hard">Extra hard</option></select></label><label class="fam-row" data-help-en="Choose the setting for this board." data-help-ja="この盤の設定を選びます。"><span id="material-label">Board material</span><select class="fam-field" id="material"><option value="ivory">Ivory</option><option value="wood">Wood</option><option value="slate">Slate</option></select></label><label class="fam-row" data-help-en="Choose the setting for this board." data-help-ja="この盤の設定を選びます。"><span id="pieces-label">Numbers</span><select class="fam-field" id="pieces"><option value="ink">Ink</option><option value="tiles">Tiles</option></select></label><label class="fam-row" data-help-en="Choose the setting for this board." data-help-ja="この盤の設定を選びます。"><span id="seed-label">Seed</span><input class="fam-field" id="seed" type="number" min="1" max="2147483647" value="42" required></label><button class="fam-button" data-primary="true" id="new" type="submit">New puzzle →</button></form><button class="text-button" id="share">Share puzzle</button><p id="notice" role="status"></p><p id="unique">Every generated puzzle has one proved answer. All play stays on your device.</p></aside>
<section class="panel fam-felt"><div class="panel-head"><h2>Shikaku</h2><span id="summary"></span></div><div id="board"></div><p id="clock" aria-live="off"></p></section></div>
<!--family-footer--><!--family-unreviewed--></main><!--family-script--><script type="module" src="shikaku.js"></script></body></html>
