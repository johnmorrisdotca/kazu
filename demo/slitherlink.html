<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kazu · Slitherlink</title><link rel="stylesheet" href="family.css"><link rel="stylesheet" href="slitherlink.css"></head>
<body><main><!--family-header--><div class="layout"><aside><h2 id="field-title">Your board</h2><form id="setup"><label class="fam-row"><span id="size-label">Size</span><select class="fam-field" id="size"><option value="5">5 × 5</option><option value="7" selected>7 × 7</option><option value="wide">10 × 6</option><option value="tall">6 × 10</option><option value="custom">Custom</option></select></label><div class="dimensions"><label class="fam-row"><span>Width</span><input class="fam-field" id="width" type="number" min="2" max="10" value="7"></label><label class="fam-row"><span>Height</span><input class="fam-field" id="height" type="number" min="2" max="10" value="7"></label></div><label class="fam-row"><span id="material-label">Board material</span><select class="fam-field" id="material"><option value="ivory">Ivory</option><option value="wood">Wood</option><option value="slate">Slate</option></select></label><label class="fam-row"><span id="seed-label">Seed</span><input class="fam-field" id="seed" type="number" min="1" value="42"></label><button class="fam-button" type="submit" id="new">New puzzle</button></form><button class="text-button" id="share">Share puzzle</button><p id="notice" role="status"></p><p id="unique">Every puzzle is checked for a unique answer.</p></aside><section class="panel fam-felt"><div class="panel-head"><h2>Slitherlink</h2><span id="summary"></span></div><div id="board"></div><p id="clock"></p></section></div><section class="more"><h2 id="rules-title">How to play</h2><p id="rules">Join neighbouring dots to make one loop. Each number tells how many of its four sides belong to the loop. The line cannot branch or cross itself.</p></section><!--family-footer--><!--family-unreviewed--></main><!--family-script--><script type="module" src="slitherlink.js"></script></body></html>
