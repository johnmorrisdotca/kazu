<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="light dark"><title>Kazu · number puzzle</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}</style></head><body><script type="module">
import "../dist/element-define.js";
import { KAZU_KINDS, KAZU_LEVELS, KAZU_SPECS, isKazuSize, readGivens, decodeRun, decodeNotes, decodeCells, checkKazu } from "../dist/index.js";
import { isKazuSeed } from "../dist/random.js";
import { embedDay } from "../dist/embed-day.js";
const query=new URLSearchParams(location.search.length>1?location.search:location.hash.slice(1));
const board=document.createElement("kazu-board");
const kind=KAZU_KINDS.includes(query.get("kind"))?query.get("kind"):"number-place";
const asked=Number(query.get("grid")??query.get("size"));const grid=isKazuSize(kind,asked)?asked:KAZU_SPECS[kind].defaultSize;
board.setAttribute("kind",kind);board.setAttribute("grid",String(grid));
board.setAttribute("level",KAZU_LEVELS.includes(query.get("level"))?query.get("level"):"medium");
if(isKazuSeed(Number(query.get("seed"))))board.setAttribute("seed",query.get("seed"));
for(const[name,values]of Object.entries({size:["small","medium","large"],theme:["auto","light","dark"],lang:["en","ja"],hints:["place","show","off","false","no","0"],check:["count","show","off","false","no","0"]}))if(values.includes(query.get(name)))board.setAttribute(name,query.get(name));
try{if(embedDay(query.get("daily"))!==null)board.setAttribute("daily",query.get("daily"));}catch{}
for(const name of["conflicts","peers","tidy","tap-to-step","clock","controls"]){const value=query.get(name)?.trim().toLowerCase();if(value!==undefined&&["","on","true","1","off","false","no","0"].includes(value))board.setAttribute(name,value);}
for(const[name,min,max]of[["width",200,2000],["elapsed",0,31536000000]]){const value=Number(query.get(name));if(query.has(name)&&Number.isFinite(value)&&value>=min&&value<=max)board.setAttribute(name,String(value));}
if(query.has("label")&&query.get("label").length<=200)board.setAttribute("label",query.get("label"));
if(query.get("lang")==="ja")document.documentElement.lang="ja";
const givens=query.get("givens");if(givens&&givens.length<=KAZU_SPECS[kind].mostCells&&readGivens(kind,grid,givens)!==null){board.setAttribute("givens",givens);const solution=query.get("solution");if(solution&&decodeCells(solution,grid)!==null&&checkKazu(kind,grid,givens,solution).ok)board.setAttribute("solution",solution);}
const run=query.get("run");if(run&&decodeRun(run,grid)!==null)board.setAttribute("run",run);
const notes=query.get("notes");if(notes&&notes.length<=grid*grid*6&&decodeNotes(notes,grid)!==null)board.setAttribute("notes",notes);
for(const type of["kazu-load","kazu-error","kazu-change","kazu-hint","kazu-check","kazu-solve"])board.addEventListener(type,event=>{if(parent!==window)parent.postMessage({type:event.type,detail:JSON.parse(JSON.stringify(event.detail))},"*");});
document.body.append(board);
</script></body></html>
